spring:
  application:
    name: GoLogAPI

  datasource:
    url:  jdbc:postgresql://${DB_HOST:localhost}:5432/gologdb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  session:
    store-type: none

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.http.convert.json: DEBUG

api:
  security:
    token:
      secret: ${JWT_SECRET}

  route-optimization:
    url: https://routeoptimization.googleapis.com/v1

springdoc:
  packages-to-scan: GoLogAPI.controller
  swagger-ui:
    path: /swagger-ui.html

